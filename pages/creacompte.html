<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page d'inscription</title>
    <link rel="stylesheet" href="../assets/css/crea.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">   
</head>
<body style="font-family: 'Poppins';">
    <div class="signup-container">
        <div class="signup-box">
            <img src="../assets/img/logo.png" alt="Logo" class="logo">
            <h2>Inscrivez-vous pour continuer</h2>
            <form id="signup-form">
                <input type="email" id="email" placeholder="Saisissez votre adresse e-mail" required>
                <input type="password" id="password" placeholder="Mot de passe" required>
                <input type="password" id="confirm-password" placeholder="Confirmer votre mot de passe" required>
                <button type="submit" class="btn">Continuer</button>
                <p class="terms">
                    En m'inscrivant, j'accepte les <a href="condiutili.html">conditions d'utilisation</a> et je confirme avoir pris connaissance de sa <a href="polconf.html">politique de confidentialité</a>.
                </p>
            </form>
            <div class="or">Ou continuez avec :</div>
            <div class="social-login">
                <button class="social-btn google">Google
                  <img src="../assets/img/Google__G__logo.svg.png" alt="Google" width="20" class="me-2">
                </button>
                <button class="social-btn microsoft">Microsoft
                  <img src="../assets/img/microsoft.png" alt="Microsoft" width="20" class="me-2">
                </button>
                <button class="social-btn apple">Apple
                  <img src="../assets/img/Apple.png" alt="Apple" width="20" class="me-2">
                </button>
            </div>
            <div class="footer">
                <p>Vous avez déjà un compte ? <a href="connexion.html">Connectez-vous à un compte</a></p>
                <p>
                    <a href="polconf.html">Politique de confidentialité</a> •
                    <a href="condiutili.html">Conditions d'utilisations</a>
                </p>
            </div>
        </div>
    </div>
    <script src="../assets/js/creacompte.js"></script>
</body>
</html>
