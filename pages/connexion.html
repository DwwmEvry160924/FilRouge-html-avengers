<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page de connexion</title>
    <link rel="stylesheet" href="../assets/css/connexion.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">    
</head>
<body style="font-family: 'Poppins';">
    <div class="login-container">
        <div class="login-box">
            <img src="../assets/img/logo.png" alt="Logo" class="logo">
            <h2>Connectez-vous pour continuer</h2>
            <form id="login-form">
                <input type="email" id="email" placeholder="Saisissez votre adresse e-mail" required><br>
                <input type="password" id="password" placeholder="Mot de passe" required><br>
                <button type="submit" class="btn">Continuer</button>
            </form>
            <div class="or">Ou continuez avec :</div>
            <div class="social-login">
                <button class="social-btn google">Google
                  <img src="../assets/img/Google__G__logo.svg.png" alt="Google" width="20" class="me-2">
                </button><br>
                <button class="social-btn microsoft">Microsoft
                  <img src="../assets/img/microsoft.png" alt="Microsoft" width="20" class="me-2">
                </button><br>
                <button class="social-btn apple">Apple
                  <img src="../assets/img/Apple.png" alt="Apple" width="20" class="me-2">
                </button><br>
            </div>
            <div class="footer">
                <p>Vous ne pouvez pas vous connecter ? <a href="../pages/creacompte.html">Créer un compte</a></p>
                <p>
                    <a href="polconf.html">Politique de confidentialité</a> •
                    <a href="condiutili.html">Conditions d'utilisations</a>
                </p>
            </div>
        </div>
    </div>
    <script src="../assets/js/connexion.js"></script>
</body>
</html>
